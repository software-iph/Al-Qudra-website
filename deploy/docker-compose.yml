# ALQUDRA website + dashboard (alqudra-ec.com) - lives in /opt/alqudra on the VPS:
#   /opt/alqudra/.env        secrets (not in git)
#   /opt/alqudra/src/        this GitHub repo; update with: sh /opt/alqudra/update.sh
# Used with --project-directory /opt/alqudra (see update.sh), so paths below start there.
# One Next.js app serves the public site AND the dashboard (/admin); PostgreSQL stores the content.
# Planned: Nginx Proxy Manager  alqudra-ec.com + www  ->  alqudra-web:3000 (then remove "ports").
name: alqudra

services:
  alqudra-web:
    build: ./src/web                  # GitHub code, cloned to /opt/alqudra/src (built on the VPS)
    image: alqudra-web
    container_name: alqudra-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@alqudra-db:5432/${DB_NAME}
    ports:
      - "3008:3000"                    # temporary public test address http://102.203.203.160:3008
    volumes:
      - uploads:/app/uploads           # photos/videos uploaded from the dashboard
    depends_on:
      alqudra-db:
        condition: service_healthy
    networks: [proxy, internal]

  alqudra-db:
    image: postgres:18-alpine
    container_name: alqudra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  uploads:
  db:

networks:
  proxy:
    external: true                    # shared with Nginx Proxy Manager
  internal:
